name: agrismart
description: "AgriSmart detects plant pests and diseases from a photo, with treatment guidance for farmers and agricultural stakeholders."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  geolocator: ^13.0.2
  video_player: ^2.11.1
  chewie: ^1.14.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  biometric_signature: ^13.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
