name: agrismart
description: "AgriSmart detects plant pests and diseases from a photo, with treatment guidance for farmers and agricultural stakeholders."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  geolocator: ^13.0.2
  video_player: ^2.11.1
  chewie: ^1.14.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  biometric_signature: ^13.0.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo_mark.png
    - assets/images/crops/

# Home-screen icon on every platform. Regenerate after changing the artwork:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#EAF0E9"
    theme_color: "#2FAE7B"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

# OS launch screen shown before Flutter draws its first frame; it hands off to
# the animated SplashScreen, which starts from the same centred logo.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EAF0E9"
  color_dark: "#12211A"
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_android12.png
    color: "#EAF0E9"
    color_dark: "#12211A"
  web: true

